# Render Blueprint for the realtime backend.
#
# The Next.js app is NOT deployed here — it lives on Vercel. Only the
# always-on Socket.IO service runs on Render, because Vercel's serverless
# functions can't hold long-lived connections or in-memory matchmaking state.
services:
  - type: web
    name: xeetcode-server
    runtime: node
    plan: free
    region: oregon

    # Build from the monorepo root so npm workspaces resolve @xeetcode/shared.
    #
    # `--include=dev` is required: NODE_ENV=production (set below, for runtime)
    # makes npm skip devDependencies, and TypeScript lives there — without this
    # the build dies with "tsc: command not found".
    buildCommand: npm ci --include=dev && npm run build -w @xeetcode/server
    startCommand: node apps/server/dist/index.js

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      # Origins allowed to open a socket / call the API. This is a public URL,
      # not a secret, so it lives here rather than being hand-set in the
      # dashboard — the blueprint stays reproducible.
      # Comma-separate to allow several (e.g. to add preview deployments).
      - key: CORS_ORIGIN
        value: https://xeetcode-web.vercel.app
