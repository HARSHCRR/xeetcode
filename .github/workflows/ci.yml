name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `shared` compiles to dist/, which web and server both resolve against,
      # so it has to exist before anything else is checked.
      - name: Build shared package
        run: npm run build -w @xeetcode/shared

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
